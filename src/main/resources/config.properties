# Configuración de Conexión a Base de Datos (SICA)
# Nota: Configurado en modo H2 (Memoria Embebida Zero-Config) para permitir ejecución inmediata al clonar el repositorio.
# Sobreescribir con un archivo .env en la raíz del proyecto para credenciales privadas de MySQL si se desea.
db.engine=H2
db.url=jdbc:h2:mem:sica;DB_CLOSE_DELAY=-1;MODE=MySQL
db.user=sa
db.password=
